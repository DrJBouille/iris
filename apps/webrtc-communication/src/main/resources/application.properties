quarkus.http.port=9000

# --- SECURITY CONFIG ---
quarkus.oidc.auth-server-url=http://localhost:8080/realms/iris-dev
quarkus.oidc.client-id=backend
quarkus.oidc.credentials.secret=xxx
quarkus.oidc.application-type=service

# --- CORST CONFIG ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true

# --- JDBC CONFIG ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=admin_user
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/iris

# --- Hibernate / JPA ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql