global:
  scrape_interval: 60s
  scrape_timeout: 40s

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: scylla
    static_configs:
      - targets: ["scylla:9180"]
  
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]